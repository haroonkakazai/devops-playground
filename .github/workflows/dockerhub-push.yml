name: Docker Hub Push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: my-static-site

jobs:
  docker-build-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Image
        run: |
         docker build \
         -t ${{ secrets.DOCKER_USERNAME }}/my-static-site:${{ github.event.inputs.image_tag }} \
         -t ${{ secrets.DOCKER_USERNAME }}/my-static-site:${{ github.sha }} \
         ./kubernetes/nginx-static-site

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      - name: Push commit SHA tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}